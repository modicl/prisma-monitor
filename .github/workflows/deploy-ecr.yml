name: Build & Push to ECR

# Construye la imagen del monitor (SOLO la API; el front se despliega aparte en Amplify) y la sube a
# Amazon ECR en push a cloudnative (rama principal del proyecto). Antes corre los tests: si fallan,
# no se publica nada.
#
# GitHub Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_REGION
#
# Ojo: las credenciales del AWS Academy Learner Lab caducan al cerrar el lab; hay que actualizar estos
# tres secretos cada vez que se reinicia.

on:
  push:
    branches: [cloudnative]
  workflow_dispatch:

env:
  ECR_REPOSITORY: prisma-monitor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Tests del backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tests del front
        run: node --test tests/js/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY"

      - name: Build, tag & push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # Se usa el tag :latest (no digest): un digest fijo en la task definition haria que este push no cambie nada.
      - name: Force ECS redeploy
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'prisma-cluster' }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE || 'prisma-monitor' }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager \
            --query 'service.{name:serviceName,desired:desiredCount,running:runningCount}' \
            --output table
